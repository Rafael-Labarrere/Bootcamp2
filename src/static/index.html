<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskTracker</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1f2340;--muted:#6b7090;--line:#e3e5f1;--brand:#5b5bd6;--brand-d:#4747b8;
--alta:#e5484d;--media:#f5a524;--baixa:#30a46c;--shadow:0 8px 30px rgba(40,40,100,.08);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1b1d2b;--text:#eceef9;--muted:#9a9fc0;--line:#2c2f45;--brand:#7c7cf0;--brand-d:#9b9bff;--shadow:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}h1 span{color:var(--brand)}
header p{margin:2px 0 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.listas{display:grid;gap:22px;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
h2{margin:0 0 14px;font-size:1.1rem}
label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 6px}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:inherit}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prio input{position:absolute;opacity:0}
.prio label{margin:0;text-align:center;padding:10px 6px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.prio label:hover{border-color:var(--c)}
.prio input:checked+label{background:var(--c);border-color:var(--c);color:#fff}
.prio input:focus-visible+label{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.btn{margin-top:20px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--brand-d)}.btn:active{transform:scale(.98)}
.erro{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--alta) 14%,transparent);color:var(--alta);font-size:.9rem;font-weight:600}
.dica{margin:12px 0 0;color:var(--muted);font-size:.8rem}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.78rem}
.topo{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.topo h2{margin:0}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--text);padding:5px 12px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.tarefa{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 16px;margin-bottom:12px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.tarefa h3{margin:0;font-size:1.02rem;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tarefa .id{color:var(--muted);font-weight:400;font-size:.8rem}
.tarefa p{margin:6px 0 10px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;font-weight:600}
.tag{padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.tag.n{--c:var(--muted)}
.vazio{text-align:center;color:var(--muted);padding:36px 10px}.vazio b{display:block;font-size:2rem}
.btn.sec{background:transparent;color:var(--muted);border:1.5px solid var(--line);margin-top:10px}
.btn.sec:hover{background:var(--line)}
.editando{border-color:var(--brand)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent),var(--shadow)!important}
.ed{border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:2px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.ed:hover{border-color:var(--brand);color:var(--brand)}
.ed.del:hover{border-color:var(--alta);color:var(--alta)}
.ed.sim{background:var(--alta);border-color:var(--alta);color:#fff;font-weight:600}
.conf{color:var(--alta);font-size:.8rem;font-weight:600;margin-right:4px}
.tarefa.fim h3>span:first-child{text-decoration:line-through;opacity:.6}
.tag.ok{--c:var(--baixa)}.tag.and{--c:var(--media)}
select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
select:focus{outline:none;border-color:var(--brand)}
.progresso{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.progresso>i{display:block;height:100%;width:var(--p);background:var(--baixa);transition:width .3s}
.sub-toggle{margin-top:10px;border:0;background:transparent;color:var(--brand);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:6px}
.sub-toggle:hover{color:var(--brand-d);text-decoration:underline}
.sub-toggle .seta{display:inline-block;transition:transform .2s}
.sub-toggle[aria-expanded=true] .seta{transform:rotate(90deg)}
.subs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.subs[hidden]{display:none}
.subs label{display:flex;align-items:center;gap:10px;margin:0;font-weight:400;font-size:.92rem;padding:6px 8px;border-radius:8px;cursor:pointer;overflow-wrap:anywhere}
.subs label:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.subs input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--brand);cursor:pointer}
.subs li.feita span{text-decoration:line-through;color:var(--muted)}
.sub-form{display:flex;gap:8px}.sub-form input{flex:1;min-width:0}
.btn.mini{margin:0;width:auto;padding:0 16px;white-space:nowrap}
.subs.editor{margin-top:10px}
.subs.editor li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 2px;font-size:.9rem;overflow-wrap:anywhere}
.subs.editor li.nada{color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--baixa);color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;box-shadow:var(--shadow);transition:.3s;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<header><h1>Task<span>Tracker</span></h1><p>Organize suas tarefas com prioridade e prazo.</p></header>
<main>
  <section class="card" id="cardForm">
    <h2 id="tituloForm">Nova tarefa</h2>
    <form id="form" novalidate>
      <label for="titulo">Título <small>(obrigatório)</small></label>
      <input type="text" id="titulo" autocomplete="off" autofocus placeholder="Ex.: Elaborar relatório de vendas">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" placeholder="Detalhes da tarefa (opcional)"></textarea>
      <label>Prioridade</label>
      <div class="prio">
        <span style="--c:var(--alta)"><input type="radio" name="prioridade" id="p1" value="Alta"><label for="p1">Alta</label></span>
        <span style="--c:var(--media)"><input type="radio" name="prioridade" id="p2" value="Média" checked><label for="p2">Média</label></span>
        <span style="--c:var(--baixa)"><input type="radio" name="prioridade" id="p3" value="Baixa"><label for="p3">Baixa</label></span>
      </div>
      <label for="data">Data limite</label>
      <input type="date" id="data">
      <div id="blocoStatus" hidden>
        <label for="status">Status</label>
        <select id="status"><option>Pendente</option><option>Em andamento</option><option>Concluída</option></select>
      </div>
      <div id="blocoSubs" hidden>
        <label for="novaSub">Subtasks <small>(adicionadas na hora)</small></label>
        <div class="sub-form">
          <input type="text" id="novaSub" maxlength="120" autocomplete="off" placeholder="Ex.: Reunir dados do trimestre">
          <button class="btn mini" type="button" id="btnAddSub">+ Adicionar</button>
        </div>
        <ul class="subs editor" id="listaSubsForm"></ul>
      </div>
      <div class="erro" id="erro" role="alert"></div>
      <button class="btn" type="submit" id="btnSalvar">Cadastrar tarefa</button>
      <button class="btn sec" type="button" id="btnCancelar" hidden>Cancelar edição</button>
      <p class="dica"><kbd>Esc</kbd> cancela a edição ou exclusão · <kbd>Enter</kbd> no título ou <kbd>Ctrl</kbd>+<kbd>Enter</kbd> na descrição para salvar.</p>
    </form>
  </section>
  <div class="listas">
    <section class="card">
      <div class="topo">
        <h2>Tarefas <span id="cont" style="color:var(--muted);font-weight:400"></span></h2>
        <div class="filtros" id="filtros"></div>
      </div>
      <div id="lista"></div>
    </section>
    <section class="card">
      <div class="topo">
        <h2>Tarefas concluídas <span id="contConcluidas" style="color:var(--muted);font-weight:400"></span></h2>
      </div>
      <div id="listaConcluidas"></div>
    </section>
  </div>
</main>
<div id="toast" role="status"></div>
<script>
const COR={Alta:"var(--alta)","Média":"var(--media)",Baixa:"var(--baixa)"};
let tarefas=[],filtro="Todas",editandoId=null,confirmandoId=null;
const abertas=new Set(); // IDs das tarefas com o dropdown de subtasks aberto
const $=id=>document.getElementById(id);

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function dataBR(iso){const[a,m,d]=iso.split("-");return `${d}/${m}/${a}`}
function dataISO(br){const p=br.split("/");return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:""}

function modoEdicao(t){
  editandoId=t?t.id:null;
  const ed=!!t;
  $("tituloForm").textContent=ed?`Personalizando tarefa #${t.id}`:"Nova tarefa";
  $("btnSalvar").textContent=ed?"Salvar alterações":"Cadastrar tarefa";
  $("btnCancelar").hidden=!ed;$("blocoStatus").hidden=!ed;$("blocoSubs").hidden=!ed;
  $("cardForm").classList.toggle("editando",ed);
  erro("");
  if(ed){
    $("titulo").value=t.titulo;$("descricao").value=t.descricao;
    document.querySelector(`input[name=prioridade][value="${t.prioridade}"]`).checked=true;
    $("data").value=dataISO(t.data_limite);$("status").value=t.status;
    desenharSubsForm();$("titulo").focus();$("cardForm").scrollIntoView({behavior:"smooth",block:"nearest"});
  }else{$("form").reset()}
}

function desenhar(){
  const filtros=$("filtros");filtros.replaceChildren();
  ["Todas","Alta","Média","Baixa"].forEach(f=>{
    const b=el("button","chip",f);b.type="button";b.setAttribute("aria-pressed",f===filtro);
    b.onclick=()=>{filtro=f;desenhar()};filtros.append(b)});
  const ativas=tarefas.filter(t=>t.status!=="Concluída");
  const vis=ativas.filter(t=>filtro==="Todas"||t.prioridade===filtro).slice().reverse();
  const concluidas=tarefas.filter(t=>t.status==="Concluída").slice().reverse();
  $("cont").textContent=`(${vis.length})`;
  $("contConcluidas").textContent=`(${concluidas.length})`;
  desenharLista($("lista"),vis,ativas.length?"Nenhuma tarefa com essa prioridade.":"Nenhuma tarefa pendente ou em andamento.");
  desenharLista($("listaConcluidas"),concluidas,"Nenhuma tarefa concluída.");
}

function desenharLista(lista,itens,mensagemVazia){
  lista.replaceChildren();
  if(!itens.length){const v=el("div","vazio");v.append(el("b",0,"📝"),el("span",0,mensagemVazia));lista.append(v);return}
  itens.forEach(t=>{
    const c=el("article","tarefa");c.style.setProperty("--c",COR[t.prioridade]);
    if(t.status==="Concluída")c.classList.add("fim");
    const h=el("h3");h.append(el("span",0,t.titulo));
    const dir=el("span");
    const be=el("button","ed","⚙️ Personalizar tasks");be.type="button";be.onclick=()=>modoEdicao(t);
    dir.append(be," ");
    if(confirmandoId===t.id){
      const q=el("span","conf","Excluir?");
      const sim=el("button","ed sim","Sim, excluir");sim.type="button";sim.onclick=()=>excluir(t);
      const nao=el("button","ed","Não");nao.type="button";nao.onclick=()=>{confirmandoId=null;desenhar()};
      dir.append(q,sim," ",nao);
    }else{
      const bx=el("button","ed del","🗑️ Excluir");bx.type="button";
      bx.onclick=()=>{confirmandoId=t.id;desenhar()};dir.append(bx);
    }
    h.append(dir);c.append(h);
    if(t.descricao)c.append(el("p",0,t.descricao));
    const tags=el("div","tags");const p=el("span","tag","Prioridade "+t.prioridade);p.style.setProperty("--c",COR[t.prioridade]);
    tags.append(p,el("span","tag n","📅 "+(t.data_limite||"Sem prazo")),el("span","tag "+(t.status==="Concluída"?"ok":t.status==="Em andamento"?"and":"n"),t.status));
    const subs=t.subtarefas||[];
    const feitas=subs.filter(x=>x.concluida).length;
    if(subs.length)tags.append(el("span","tag "+(feitas===subs.length?"ok":"n"),`☑ ${feitas}/${subs.length}`));
    c.append(tags);
    if(subs.length){
      const prog=el("div","progresso");const barra=el("i");
      barra.style.setProperty("--p",Math.round(feitas/subs.length*100)+"%");prog.append(barra);c.append(prog);
      const aberto=abertas.has(t.id);
      const ul=el("ul","subs");ul.id=`subs-${t.id}`;ul.hidden=!aberto;
      subs.forEach(x=>ul.append(itemSub(t,x)));
      const bt=el("button","sub-toggle");bt.type="button";
      bt.setAttribute("aria-expanded",aberto);bt.setAttribute("aria-controls",ul.id);
      bt.append(el("span","seta","▸"),el("span",0,"Visualizar subtasks"));
      bt.onclick=()=>{ // alterna sem redesenhar, para o foco do teclado não se perder
        const abrir=ul.hidden;ul.hidden=!abrir;bt.setAttribute("aria-expanded",abrir);
        if(abrir)abertas.add(t.id);else abertas.delete(t.id)};
      c.append(bt,ul);
    }
    lista.append(c)});
}

function itemSub(t,x){
  const li=el("li",x.concluida?"feita":"");const lb=el("label");
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=x.concluida;cb.id=`sub-${t.id}-${x.id}`;
  cb.onchange=()=>marcarSub(t.id,x.id,cb.checked);
  lb.append(cb,el("span",0,x.titulo));li.append(lb);return li;
}

function atualizar(d){tarefas=tarefas.map(t=>t.id===d.id?d:t)}

function desenharSubsForm(){
  const ul=$("listaSubsForm");ul.replaceChildren();
  const t=tarefas.find(x=>x.id===editandoId);if(!t)return;
  const subs=t.subtarefas||[];
  if(!subs.length){ul.append(el("li","nada","Nenhuma subtask cadastrada."));return}
  subs.forEach(x=>{
    const li=el("li");li.append(el("span",0,(x.concluida?"✔ ":"")+x.titulo));
    const b=el("button","ed del","Remover");b.type="button";
    b.setAttribute("aria-label","Remover subtask "+x.titulo);b.onclick=()=>removerSub(t.id,x.id);
    li.append(b);ul.append(li)});
}

async function chamar(url,metodo,corpo){
  const r=await fetch(url,{method:metodo,headers:{"Content-Type":"application/json"},body:corpo?JSON.stringify(corpo):undefined});
  return{ok:r.ok,dados:await r.json()};
}

async function adicionarSub(){
  if(editandoId===null)return;
  const campo=$("novaSub"),titulo=campo.value.trim();
  if(!titulo){erro("Digite o título da subtask.");campo.focus();return}
  erro("");
  try{
    const{ok,dados}=await chamar(`/api/tarefas/${editandoId}/subtarefas`,"POST",{titulo});
    if(!ok){erro(dados.erro||"Erro ao adicionar subtask.");return}
    atualizar(dados);campo.value="";desenhar();desenharSubsForm();campo.focus();toast("Subtask adicionada!");
  }catch{erro("Não foi possível conectar ao servidor.")}
}

async function removerSub(idTarefa,idSub){
  try{
    const{ok,dados}=await chamar(`/api/tarefas/${idTarefa}/subtarefas/${idSub}`,"DELETE");
    if(!ok){toast(dados.erro||"Erro ao remover subtask.",true);return}
    atualizar(dados);desenhar();desenharSubsForm();toast("Subtask removida.");
  }catch{toast("Não foi possível conectar ao servidor.",true)}
}

async function marcarSub(idTarefa,idSub,concluida){
  const foco=document.activeElement&&document.activeElement.id; // restaura o foco após redesenhar
  try{
    const{ok,dados}=await chamar(`/api/tarefas/${idTarefa}/subtarefas/${idSub}`,"PATCH",{concluida});
    if(!ok){toast(dados.erro||"Erro ao atualizar subtask.",true);await carregar();return}
    atualizar(dados);
  }catch{toast("Não foi possível conectar ao servidor.",true)}
  desenhar();if(editandoId!==null)desenharSubsForm();
  if(foco&&$(foco))$(foco).focus();
}

async function excluir(t){
  try{
    const r=await fetch(`/api/tarefas/${t.id}`,{method:"DELETE"});
    if(!r.ok&&r.status!==404){const d=await r.json();toast(d.erro||"Erro ao excluir.",true);return}
    tarefas=tarefas.filter(x=>x.id!==t.id);confirmandoId=null;
    if(editandoId===t.id)modoEdicao(null);
    desenhar();toast(r.ok?`Tarefa #${t.id} excluída.`:"Essa tarefa já não existe mais.");
  }catch{toast("Não foi possível conectar ao servidor.",true)}
}

async function carregar(){
  try{tarefas=await(await fetch("/api/tarefas")).json()}catch{tarefas=[]}desenhar()}

function toast(msg,err){const t=$("toast");t.textContent=msg;t.style.background=err?"var(--alta)":"";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)}
function erro(msg){const e=$("erro");e.textContent=msg;e.style.display=msg?"block":"none"}

$("form").addEventListener("submit",async ev=>{
  ev.preventDefault();erro("");
  const titulo=$("titulo").value.trim();
  if(!titulo){erro("O título é obrigatório.");$("titulo").focus();return}
  const iso=$("data").value;
  const corpo={titulo,descricao:$("descricao").value,
    prioridade:document.querySelector("input[name=prioridade]:checked").value,
    data_limite:iso?dataBR(iso):""};
  const ed=editandoId!==null;
  if(ed)corpo.status=$("status").value;
  try{
    const r=await fetch(ed?`/api/tarefas/${editandoId}`:"/api/tarefas",{method:ed?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)});
    const d=await r.json();
    if(!r.ok){erro(d.erro||"Erro ao salvar.");return}
    if(ed){tarefas=tarefas.map(t=>t.id===d.id?d:t)}else{tarefas.push(d);filtro="Todas"}
    modoEdicao(null);desenhar();$("titulo").focus();
    toast(ed?`Tarefa #${d.id} atualizada com sucesso!`:`Tarefa "${d.titulo}" cadastrada com sucesso!`);
  }catch{erro("Não foi possível conectar ao servidor.")}
});
$("btnCancelar").onclick=()=>modoEdicao(null);
$("btnAddSub").onclick=adicionarSub;
$("novaSub").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();adicionarSub()}});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(confirmandoId!==null){confirmandoId=null;desenhar()}else if(editandoId!==null)modoEdicao(null)});
$("descricao").addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter")$("form").requestSubmit()});
carregar();
</script>
</body>
</html>
